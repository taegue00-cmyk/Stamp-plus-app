<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>브릿지 스탬프 - 사장님 전용</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh; display: flex; justify-content: center;
    font-family: 'Gowun Dodum', '고운 돋움', 'Malgun Gothic', '맑은 고딕', sans-serif;
    color: #3b2f4a;
    background: linear-gradient(135deg, #ffd6e0 0%, #ffe9c7 45%, #c9e7ff 100%) fixed;
  }
  .app { width: 100%; max-width: 440px; padding: 24px 16px 40px; }
  .shop { text-align: center; font-size: 26px; font-weight: bold; margin: 0; }
  .guide { text-align: center; font-size: 15px; opacity: .75; margin: 6px 0 18px; }
  .card {
    background: rgba(255,255,255,.45);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,.7);
    border-radius: 24px; padding: 18px; margin-bottom: 14px;
    box-shadow: 0 8px 28px rgba(120,90,160,.18);
  }
  label { display: block; font-size: 16px; margin: 0 0 8px 4px; }
  input {
    width: 100%; padding: 16px; font: inherit; font-size: 28px; letter-spacing: 10px; text-align: center;
    color: inherit; border: 1px solid rgba(255,255,255,.8); border-radius: 18px;
    background: rgba(255,255,255,.7); outline: none; margin-bottom: 12px;
  }
  input:focus { box-shadow: 0 0 0 3px rgba(255,140,170,.4); }
  .btn {
    display: block; width: 100%; padding: 22px 10px; font: inherit; font-size: 26px; font-weight: bold;
    color: #fff; cursor: pointer; border: none; border-radius: 22px; margin-bottom: 12px;
    background: linear-gradient(135deg, #ff8fb1, #ffb27a);
    box-shadow: 0 6px 16px rgba(255,120,150,.35);
  }
  .btn:active { transform: scale(.98); }
  .btn.cancel { background: rgba(255,255,255,.8); color: #3b2f4a; box-shadow: 0 4px 12px rgba(120,90,160,.2); font-size: 22px; padding: 18px 10px; }
  .btn.done { background: linear-gradient(135deg, #5ec9a5, #7fd8be); box-shadow: 0 6px 16px rgba(80,190,150,.4); }
  .btn.small { font-size: 16px; padding: 12px; font-weight: normal; margin-bottom: 0; }
  .btn:disabled { opacity: .45; cursor: default; }
  .msg { text-align: center; font-size: 17px; min-height: 24px; margin: 4px 0 8px; }
  .name { text-align: center; font-size: 22px; font-weight: bold; }
  .big { text-align: center; font-size: 40px; font-weight: bold; margin: 6px 0; }
  .board { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; margin: 12px 0; }
  .dot {
    aspect-ratio: 1; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.55); border: 2px dashed rgba(180,150,200,.6);
    font-size: 11px; color: rgba(90,70,110,.55);
  }
  .dot.full {
    border: 2px solid #fff; color: #fff; font-size: 15px;
    background: linear-gradient(135deg, #ff8fb1, #ffb27a);
    box-shadow: 0 3px 8px rgba(255,120,150,.4);
  }
  .alert {
    text-align: center; font-size: 22px; font-weight: bold; padding: 16px; border-radius: 18px;
    background: rgba(255,238,150,.9); margin: 10px 0; animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse { 50% { transform: scale(1.03); } }
  .warn { background: rgba(255,230,200,.7); border-radius: 16px; padding: 10px 12px; font-size: 14px; line-height: 1.5; margin-bottom: 12px; }
  .pick { padding: 16px; font-size: 20px; text-align: center; border-radius: 16px; background: rgba(255,255,255,.75); margin-bottom: 8px; cursor: pointer; }
  .today { text-align: center; font-size: 20px; }
  .today b { font-size: 30px; color: #e0527f; }
  .hidden { display: none !important; }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 20;
    padding: 10px 20px; border-radius: 18px; font-size: 17px; background: rgba(255,255,255,.92);
    box-shadow: 0 6px 18px rgba(60,40,80,.25); transition: opacity .3s;
  }
  .toast.bad { background: #ffd6d6; color: #a00; }
</style>
</head>
<body>
<div class="app">
  <h1 class="shop">🌸 브릿지 스탬프</h1>
  <div class="guide">사장님 전용 화면</div>

  <!-- 잠금 -->
  <div class="card" id="lockCard">
    <h2 id="lockTitle" style="margin:0 0 10px;font-size:20px"></h2>
    <div class="warn" id="lockWarn"></div>
    <input id="pinInput" type="password" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off">
    <button class="btn" id="pinOk">들어가기</button>
    <div class="msg" id="pinMsg"></div>
  </div>

  <!-- 메인 -->
  <div id="main" class="hidden">
    <div class="card">
      <label for="phone">손님 휴대폰 번호 뒷 4자리</label>
      <input id="phone" inputmode="numeric" maxlength="4" placeholder="0000" autocomplete="off">
      <button class="btn" id="addBtn">적립 (+1)</button>
      <button class="btn cancel" id="undoBtn">취소 (-1)</button>
      <div class="msg" id="msg"></div>
      <div id="pickBox"></div>
    </div>

    <div class="card hidden" id="result">
      <div class="name" id="rName"></div>
      <div class="big" id="rCount"></div>
      <div class="board" id="rBoard"></div>
      <div class="alert hidden" id="rAlert">🎁 무료 음료 제공 대상입니다</div>
      <button class="btn done hidden" id="doneBtn">사용 완료 (0개로)</button>
    </div>

    <div class="card today">오늘 적립한 횟수 <b id="todayNum">0</b>번</div>

    <div class="card">
      <div class="warn" id="backupWarn"></div>
      <button class="btn small cancel" id="backupBtn">💾 백업 파일 저장</button>
      <div class="msg" id="backupMsg"></div>
      <button class="btn small cancel" id="changePin">비밀번호 바꾸기</button>
      <div class="msg" id="pinChangeMsg"></div>
      <button class="btn small cancel" id="lockBtn">🔒 잠그기</button>
    </div>
  </div>
</div>

<div class="toast hidden" id="toast"></div>

<script>
(function () {
  'use strict';
  // index.html과 같은 장부를 써서, 여기서 적립하면 손님 확인 화면에도 보여요.
  var KEY = 'stampApp_v1';
  var TODAY_KEY = 'stampApp_v1_today';
  var data = load();
  var currentId = null;

  function $(id) { return document.getElementById(id); }
  function newId() { return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
  function onlyDigits(e) { e.value = e.value.replace(/\D/g, '').slice(0, 4); }

  function load() {
    var base = { settings: { goal: 10, reward: '음료 1잔 무료', pin: '' }, customers: [] };
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return base;
      var d = JSON.parse(raw);
      if (!d || !d.settings || !Array.isArray(d.customers)) return base;
      var goal = parseInt(d.settings.goal, 10);
      if (!(goal >= 2 && goal <= 30)) goal = 10;
      var out = { settings: { goal: goal, reward: String(d.settings.reward || '음료 1잔 무료').slice(0, 20),
                  pin: /^\d{4}$/.test(String(d.settings.pin)) ? String(d.settings.pin) : '' }, customers: [] };
      d.customers.forEach(function (c) {
        if (!c || !/^\d{4}$/.test(String(c.last4))) return;
        out.customers.push({ id: String(c.id || newId()), last4: String(c.last4), nick: String(c.nick || '').slice(0, 10),
          stamps: Math.max(0, Math.min(goal, parseInt(c.stamps, 10) || 0)), rewards: Math.max(0, parseInt(c.rewards, 10) || 0) });
      });
      return out;
    } catch (e) { return base; }
  }
  var toastTimer = null;
  function toast(text, bad) {
    var t = $('toast');
    t.textContent = text; t.className = 'toast' + (bad ? ' bad' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.className = 'toast hidden'; }, bad ? 6000 : 1500);
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(data)); toast('저장됨 ✓'); return true; }
    catch (e) { toast('⚠️ 저장이 안 되었어요! 저장 공간을 확인해 주세요.', true); return false; }
  }

  // 백업: 마지막으로 저장한 시각을 기억해서 7일이 지나면 알려 줘요.
  var BK_KEY = 'stampApp_v1_backup';
  function checkBackup() {
    var t = 0;
    try { t = parseInt(localStorage.getItem(BK_KEY), 10) || 0; } catch (e) {}
    var old = !t || Date.now() - t > 7 * 86400000;
    $('backupWarn').textContent = !t ? '💾 아직 백업한 적이 없어요. 백업 파일을 저장해 주세요.'
      : old ? '💾 백업한 지 7일이 지났어요. 백업 파일을 저장해 주세요.'
      : '💾 최근에 백업했어요. 백업 파일에는 손님 뒷자리가 들어 있으니 아무에게나 보내지 마세요.';
  }
  $('backupBtn').onclick = function () {
    data = load();
    var copy = JSON.parse(JSON.stringify(data));
    copy.settings.pin = ''; // 비밀번호는 백업 파일에 넣지 않아요
    var a = document.createElement('a'), d = new Date();
    a.href = URL.createObjectURL(new Blob([JSON.stringify(copy, null, 1)], { type: 'application/json' }));
    a.download = '스탬프백업_' + d.getFullYear() + (d.getMonth() + 1) + d.getDate() + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    try { localStorage.setItem(BK_KEY, String(Date.now())); } catch (e) {}
    $('backupMsg').textContent = '백업 파일을 저장했어요.';
    checkBackup();
  };

  // 오늘 적립 횟수 (날짜가 바뀌면 0부터)
  function dayStr() { var d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
  function getToday() {
    try {
      var t = JSON.parse(localStorage.getItem(TODAY_KEY));
      if (t && t.date === dayStr() && t.count >= 0) return t.count;
    } catch (e) {}
    return 0;
  }
  function setToday(n) {
    try { localStorage.setItem(TODAY_KEY, JSON.stringify({ date: dayStr(), count: Math.max(0, n) })); } catch (e) {}
    $('todayNum').textContent = Math.max(0, n);
  }

  function label(c) { return c.nick ? c.nick + ' (' + c.last4 + ')' : '뒷자리 ' + c.last4; }
  function byId(id) { return data.customers.filter(function (c) { return c.id === id; })[0]; }

  // ---------- 잠금 ----------
  function showLock() {
    $('lockCard').classList.remove('hidden');
    $('main').classList.add('hidden');
    $('pinInput').value = ''; $('pinMsg').textContent = '';
    if (!data.settings.pin) {
      $('lockTitle').textContent = '비밀번호 만들기';
      $('lockWarn').textContent = '처음이시네요! 사장님만 아는 숫자 4자리를 정해 주세요. 손님이 실수로 만지는 것을 막아 주는 약한 잠금이에요. 생일이나 전화번호 같은 중요한 숫자는 쓰지 마세요.';
      $('pinOk').textContent = '비밀번호 정하기';
    } else {
      $('lockTitle').textContent = '비밀번호를 넣어 주세요';
      $('lockWarn').textContent = '사장님만 들어갈 수 있어요.';
      $('pinOk').textContent = '들어가기';
    }
  }
  function enter() {
    $('lockCard').classList.add('hidden');
    $('main').classList.remove('hidden');
    $('todayNum').textContent = getToday();
    $('phone').value = ''; clearResult(); updateAddBtn(); checkBackup();
  }
  $('pinInput').oninput = function () { onlyDigits(this); };
  $('pinInput').onkeydown = function (e) { if (e.key === 'Enter') $('pinOk').click(); };
  $('pinOk').onclick = function () {
    var v = $('pinInput').value;
    if (!/^\d{4}$/.test(v)) { $('pinMsg').textContent = '숫자 4개를 넣어 주세요.'; return; }
    if (!data.settings.pin) { data = load(); data.settings.pin = v; if (save()) enter(); return; }
    if (v === data.settings.pin) enter();
    else { $('pinMsg').textContent = '비밀번호가 달라요.'; $('pinInput').value = ''; }
  };
  $('lockBtn').onclick = showLock;

  $('changePin').onclick = function () {
    var v = prompt('새 비밀번호 숫자 4자리를 넣어 주세요.');
    if (v === null) return;
    if (!/^\d{4}$/.test(v)) { $('pinChangeMsg').textContent = '숫자 4개만 가능해요. 바뀌지 않았어요.'; return; }
    data = load(); data.settings.pin = v;
    $('pinChangeMsg').textContent = save() ? '비밀번호를 바꿨어요!' : '';
  };

  // ---------- 손님 찾기 ----------
  function clearResult() {
    currentId = null;
    $('result').classList.add('hidden'); $('pickBox').textContent = ''; $('msg').textContent = '';
  }
  // 번호가 4자리일 때만 적립 버튼이 눌려요
  function updateAddBtn() { $('addBtn').disabled = !/^\d{4}$/.test($('phone').value); }
  $('phone').oninput = function () { onlyDigits(this); clearResult(); updateAddBtn(); };

  // 같은 손님에게 방금 적립했는지 기억해요 (1분 기준)
  var LAST_KEY = 'stampApp_v1_last';
  function getLast() { try { return JSON.parse(localStorage.getItem(LAST_KEY)) || {}; } catch (e) { return {}; } }
  function setLast(id, t) {
    var m = getLast();
    if (t) m[id] = t; else delete m[id];
    try { localStorage.setItem(LAST_KEY, JSON.stringify(m)); } catch (e) {}
  }
  $('phone').onkeydown = function (e) { if (e.key === 'Enter') $('addBtn').click(); };

  // 번호로 손님을 정해요. 같은 번호가 여러 명이면 고르게 해요.
  function resolve(createIfNew, then) {
    data = load();
    var v = $('phone').value;
    $('pickBox').textContent = ''; $('msg').textContent = '';
    if (!/^\d{4}$/.test(v)) { $('msg').textContent = '숫자 4개를 넣어 주세요.'; return; }
    if (currentId && byId(currentId) && byId(currentId).last4 === v) { then(byId(currentId)); return; }
    var list = data.customers.filter(function (c) { return c.last4 === v; });
    if (list.length === 1) { then(list[0]); return; }
    if (list.length === 0) {
      if (!createIfNew) { $('msg').textContent = '이 번호의 손님이 없어요.'; return; }
      var c = { id: newId(), last4: v, nick: '', stamps: 0, rewards: 0 };
      data.customers.push(c); then(c); return;
    }
    $('msg').textContent = '같은 번호의 손님이 있어요. 골라 주세요.';
    list.forEach(function (c) {
      var p = el('div', 'pick', label(c) + ' · ★' + c.stamps);
      p.onclick = function () { currentId = c.id; $('pickBox').textContent = ''; $('msg').textContent = ''; then(c); };
      $('pickBox').appendChild(p);
    });
  }

  function render(c) {
    currentId = c.id;
    var goal = data.settings.goal;
    $('rName').textContent = label(c);
    $('rCount').textContent = '지금 ' + c.stamps + ' / ' + goal + '개';
    var b = $('rBoard'); b.textContent = '';
    for (var i = 1; i <= goal; i++) b.appendChild(el('div', 'dot' + (i <= c.stamps ? ' full' : ''), i <= c.stamps ? '★' : String(i)));
    var full = c.stamps >= goal;
    $('rAlert').classList.toggle('hidden', !full);
    $('doneBtn').classList.toggle('hidden', !full);
    $('result').classList.remove('hidden');
  }

  // ---------- 적립 / 취소 / 사용 완료 ----------
  $('addBtn').onclick = function () {
    resolve(true, function (c) {
      if (c.stamps >= data.settings.goal) {
        render(c); $('msg').textContent = '이미 다 모은 손님이에요. 먼저 "사용 완료"를 눌러 주세요.'; return;
      }
      var last = getLast()[c.id];
      if (last && Date.now() - last < 60000 && !confirm('방금 적립했습니다. 계속할까요?')) {
        render(c); $('msg').textContent = '적립하지 않았어요.'; return;
      }
      c.stamps++;
      if (!save()) { c.stamps--; return; }
      setLast(c.id, Date.now());
      setToday(getToday() + 1);
      render(c); $('msg').textContent = '적립했어요! ✅';
    });
  };
  $('undoBtn').onclick = function () {
    resolve(false, function (c) {
      if (c.stamps <= 0) { render(c); $('msg').textContent = '뺄 스탬프가 없어요.'; return; }
      c.stamps--;
      if (!save()) { c.stamps++; return; }
      setLast(c.id, 0);
      setToday(getToday() - 1);
      render(c); $('msg').textContent = '1개 뺐어요. ↩';
    });
  };
  $('doneBtn').onclick = function () {
    data = load();
    var c = currentId && byId(currentId);
    if (!c || c.stamps < data.settings.goal) { clearResult(); return; }
    if (!confirm(label(c) + ' 손님의 스탬프를 0개로 되돌릴까요? 무료 음료를 드린 뒤에만 눌러 주세요.')) return;
    c.stamps = 0; c.rewards++;
    if (!save()) { c.stamps = data.settings.goal; c.rewards--; return; }
    render(c); $('msg').textContent = '사용 완료! 0개로 돌아갔어요. 🎉';
  };

  // 브라우저에 "이 저장 공간은 지우지 마세요"라고 부탁해요 (받아 줄지는 브라우저가 정해요)
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}

  showLock();
})();
</script>
</body>
</html>
