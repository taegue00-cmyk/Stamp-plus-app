<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>단골 적립 스탬프</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh;
    font-family: 'Gowun Dodum', '고운 돋움', 'Malgun Gothic', '맑은 고딕', sans-serif;
    color: #3b2f4a;
    background: linear-gradient(135deg, #ffd6e0 0%, #ffe9c7 45%, #c9e7ff 100%) fixed;
    display: flex; justify-content: center;
  }
  .app { width: 100%; max-width: 440px; padding: 20px 16px 40px; }
  h1 { font-size: 24px; text-align: center; margin: 8px 0 4px; }
  .sub { text-align: center; font-size: 14px; opacity: .7; margin-bottom: 16px; }
  .card {
    background: rgba(255,255,255,.45);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,.7);
    border-radius: 24px; padding: 18px; margin-bottom: 14px;
    box-shadow: 0 8px 28px rgba(120,90,160,.18);
  }
  .card h2 { font-size: 18px; margin: 0 0 12px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tab {
    flex: 1; padding: 12px; border: 1px solid rgba(255,255,255,.7); border-radius: 18px;
    background: rgba(255,255,255,.35); font: inherit; font-size: 16px; color: inherit; cursor: pointer;
  }
  .tab.on { background: rgba(255,255,255,.85); box-shadow: 0 4px 14px rgba(120,90,160,.2); font-weight: bold; }
  input {
    width: 100%; padding: 13px 14px; font: inherit; font-size: 17px; color: inherit;
    border: 1px solid rgba(255,255,255,.8); border-radius: 16px;
    background: rgba(255,255,255,.65); outline: none; margin-bottom: 10px;
  }
  input:focus { box-shadow: 0 0 0 3px rgba(255,140,170,.4); }
  .btn {
    width: 100%; padding: 14px; font: inherit; font-size: 17px; color: #fff; cursor: pointer;
    border: none; border-radius: 18px; margin-bottom: 8px;
    background: linear-gradient(135deg, #ff8fb1, #ffb27a);
    box-shadow: 0 6px 16px rgba(255,120,150,.35);
  }
  .btn.soft { background: rgba(255,255,255,.7); color: #3b2f4a; box-shadow: 0 4px 12px rgba(120,90,160,.15); }
  .btn.small { width: auto; padding: 8px 14px; font-size: 14px; margin: 0; }
  .btn:disabled { opacity: .45; cursor: default; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .board { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; margin: 14px 0; }
  .dot {
    aspect-ratio: 1; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.55); border: 2px dashed rgba(180,150,200,.6);
    font-size: 11px; color: rgba(90,70,110,.55);
  }
  .dot.full {
    border: 2px solid #fff; color: #fff; font-size: 15px;
    background: linear-gradient(135deg, #ff8fb1, #ffb27a);
    box-shadow: 0 4px 12px rgba(255,120,150,.4);
  }
  .name { font-size: 20px; font-weight: bold; }
  .muted { font-size: 14px; opacity: .7; }
  .msg { text-align: center; font-size: 15px; margin: 6px 0; min-height: 20px; }
  .warn {
    background: rgba(255,230,200,.7); border-radius: 16px; padding: 10px 12px;
    font-size: 13px; line-height: 1.5; margin-bottom: 10px;
  }
  .item {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 10px 12px; border-radius: 16px; background: rgba(255,255,255,.55); margin-bottom: 8px;
  }
  .item.pick { cursor: pointer; }
  .hidden { display: none !important; }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 20;
    padding: 10px 20px; border-radius: 18px; font-size: 16px; background: rgba(255,255,255,.92);
    box-shadow: 0 6px 18px rgba(60,40,80,.25);
  }
  .toast.bad { background: #ffd6d6; color: #a00; }
  .reward-box {
    text-align: center; padding: 10px; border-radius: 16px; margin-bottom: 8px;
    background: rgba(255,240,170,.8); font-weight: bold;
  }
  label { font-size: 14px; display: block; margin: 4px 0 4px 4px; }

  /* 축하 화면 */
  .party {
    position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
    padding: 24px; background: rgba(60,40,80,.45);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); overflow: hidden;
  }
  .party-card {
    position: relative; z-index: 2; width: 100%; max-width: 360px; text-align: center;
    background: rgba(255,255,255,.85); border: 1px solid #fff; border-radius: 28px; padding: 30px 22px;
    box-shadow: 0 16px 40px rgba(60,40,80,.35); animation: pop .5s ease-out;
  }
  .party-card .big { font-size: 56px; }
  .party-card h2 { margin: 8px 0; font-size: 26px; }
  .party-card p { margin: 6px 0 18px; font-size: 17px; line-height: 1.5; }
  .confetti { position: absolute; top: -40px; font-size: 24px; animation: fall linear infinite; z-index: 3; pointer-events: none; }
  .confetti.paper { border-radius: 2px; }
  @keyframes fall { to { transform: translateY(115vh) rotate(720deg); } }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
</style>
</head>
<body>
<div class="app">
  <h1>🌸 브릿지 스탬프</h1>
  <div class="sub">단골 적립 · 스탬프를 모으면 선물이 와요!</div>

  <div class="tabs">
    <button class="tab on" id="tabGuest">손님 확인</button>
    <button class="tab" id="tabOwner">사장님</button>
  </div>

  <!-- 손님 화면 -->
  <div id="guestView">
    <div class="card">
      <h2>내 스탬프 보기</h2>
      <label for="guestInput">전화번호 뒷자리 4개</label>
      <input id="guestInput" inputmode="numeric" maxlength="4" placeholder="예: 1234" autocomplete="off">
      <button class="btn" id="guestFind">확인하기</button>
      <div class="msg" id="guestMsg"></div>
    </div>
    <div id="guestResult"></div>
  </div>

  <!-- 사장님 화면 -->
  <div id="ownerView" class="hidden">
    <!-- 잠금 -->
    <div class="card" id="lockCard">
      <h2 id="lockTitle">사장님 비밀번호</h2>
      <div class="warn" id="lockWarn"></div>
      <input id="pinInput" type="password" inputmode="numeric" maxlength="4" placeholder="숫자 4자리" autocomplete="off">
      <button class="btn" id="pinOk">들어가기</button>
      <div class="msg" id="pinMsg"></div>
    </div>

    <!-- 사장님 메인 -->
    <div id="ownerMain" class="hidden">
      <div class="card">
        <h2>손님 찾기 / 새 손님</h2>
        <input id="ownerInput" inputmode="numeric" maxlength="4" placeholder="전화번호 뒷자리 4개" autocomplete="off">
        <button class="btn" id="ownerFind">찾기</button>
        <div class="msg" id="ownerMsg"></div>
        <div id="ownerPick"></div>
      </div>
      <div id="ownerCustomer"></div>

      <div class="card">
        <h2>손님 목록 <span class="muted" id="countText"></span></h2>
        <div id="listBox"></div>
      </div>

      <div class="card">
        <h2>설정</h2>
        <label for="setGoal">스탬프 몇 개를 모으면 보상?</label>
        <input id="setGoal" type="number" inputmode="numeric" min="2" max="30">
        <label for="setReward">보상 이름</label>
        <input id="setReward" maxlength="20">
        <button class="btn" id="saveSet">설정 저장</button>
        <div class="msg" id="setMsg"></div>
      </div>

      <div class="card">
        <h2>백업 (꼭 해 주세요!)</h2>
        <div class="warn" id="backupWarn"></div>
        <button class="btn soft" id="exportBtn">백업 파일 저장</button>
        <button class="btn soft" id="importBtn">백업 파일 불러오기</button>
        <input type="file" id="importFile" accept=".json" class="hidden">
        <div class="msg" id="backupMsg"></div>
      </div>

      <button class="btn soft" id="lockBtn">🔒 잠그고 나가기</button>
    </div>
  </div>
</div>

<div class="party hidden" id="party">
  <div class="party-card">
    <div class="big">🎉</div>
    <h2>축하해요!</h2>
    <p id="partyText"></p>
    <button class="btn" id="closeParty">고마워요!</button>
  </div>
</div>

<div class="toast hidden" id="toast"></div>

<script>
(function () {
  'use strict';
  var KEY = 'stampApp_v1';
  var data = load();
  var unlocked = false;
  var currentId = null;

  // 브라우저에 "이 저장 공간은 지우지 마세요"라고 부탁해요 (받아 줄지는 브라우저가 정해요)
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}

  function $(id) { return document.getElementById(id); }

  function load() {
    var base = { settings: { goal: 10, reward: '음료 1잔 무료', pin: '' }, customers: [] };
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return base;
      return clean(JSON.parse(raw)) || base;
    } catch (e) { return base; }
  }
  var toastTimer = null;
  function toast(text, bad) {
    var t = document.getElementById('toast');
    t.textContent = text; t.className = 'toast' + (bad ? ' bad' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.className = 'toast hidden'; }, bad ? 6000 : 1500);
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(data)); toast('저장됨 ✓'); }
    catch (e) { toast('⚠️ 저장이 안 되었어요! 저장 공간을 확인해 주세요.', true); }
  }

  // 백업: 마지막으로 저장한 시각을 기억해서 7일이 지나면 알려 줘요.
  var BK_KEY = 'stampApp_v1_backup';
  function checkBackup() {
    var t = 0;
    try { t = parseInt(localStorage.getItem(BK_KEY), 10) || 0; } catch (e) {}
    var old = !t || Date.now() - t > 7 * 86400000;
    document.getElementById('backupWarn').textContent = !t ? '💾 아직 백업한 적이 없어요. 백업 파일을 저장해 주세요.'
      : old ? '💾 백업한 지 7일이 지났어요. 백업 파일을 저장해 주세요.'
      : '휴대폰을 바꾸거나 인터넷 기록을 지우면 스탬프가 사라질 수 있어요. 백업 파일에는 손님 뒷자리가 들어 있으니 아무에게나 보내지 마세요.';
  }

  // 다른 화면(admin.html)에서 바뀐 내용을 이 화면에도 반영해요.
  function refreshFromStorage() {
    data = load();
    if (unlocked) { renderAll(); checkBackup(); }
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) refreshFromStorage(); });
  window.addEventListener('focus', refreshFromStorage);
  // 불러온 자료가 올바른 모양인지 확인하고 깨끗하게 정리
  function clean(d) {
    if (!d || typeof d !== 'object' || !d.settings || !Array.isArray(d.customers)) return null;
    var goal = parseInt(d.settings.goal, 10);
    if (!(goal >= 2 && goal <= 30)) goal = 10;
    var pin = /^\d{4}$/.test(String(d.settings.pin)) ? String(d.settings.pin) : '';
    var out = { settings: { goal: goal, reward: String(d.settings.reward || '선물').slice(0, 20), pin: pin }, customers: [] };
    d.customers.forEach(function (c) {
      if (!c || !/^\d{4}$/.test(String(c.last4))) return;
      out.customers.push({
        id: String(c.id || newId()),
        last4: String(c.last4),
        nick: String(c.nick || '').slice(0, 10),
        stamps: Math.max(0, Math.min(goal, parseInt(c.stamps, 10) || 0)),
        rewards: Math.max(0, parseInt(c.rewards, 10) || 0)
      });
    });
    return out;
  }
  function newId() { return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function onlyDigits(el) { el.value = el.value.replace(/\D/g, '').slice(0, 4); }
  function byLast4(v) { return data.customers.filter(function (c) { return c.last4 === v; }); }
  function byId(id) { return data.customers.filter(function (c) { return c.id === id; })[0]; }
  function label(c) { return c.nick ? c.nick + ' (' + c.last4 + ')' : '뒷자리 ' + c.last4; }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  // 스탬프판 그리기
  function boardOf(c) {
    var b = el('div', 'board');
    for (var i = 1; i <= data.settings.goal; i++) {
      b.appendChild(el('div', 'dot' + (i <= c.stamps ? ' full' : ''), i <= c.stamps ? '★' : String(i)));
    }
    return b;
  }

  // ---------- 탭 ----------
  function showTab(owner) {
    data = load();
    $('tabGuest').classList.toggle('on', !owner);
    $('tabOwner').classList.toggle('on', owner);
    $('guestView').classList.toggle('hidden', owner);
    $('ownerView').classList.toggle('hidden', !owner);
    if (owner) showLock();
  }
  $('tabGuest').onclick = function () { showTab(false); };
  $('tabOwner').onclick = function () { showTab(true); };

  // ---------- 손님 화면 ----------
  $('guestInput').oninput = function () { onlyDigits(this); };
  $('guestFind').onclick = function () {
    var v = $('guestInput').value, box = $('guestResult');
    box.textContent = '';
    if (!/^\d{4}$/.test(v)) { $('guestMsg').textContent = '숫자 4개를 넣어 주세요.'; return; }
    var list = byLast4(v);
    if (!list.length) { $('guestMsg').textContent = '아직 스탬프가 없어요. 가게에서 먼저 등록해 달라고 말씀해 주세요.'; return; }
    $('guestMsg').textContent = '';
    var done = list.filter(function (c) { return c.stamps >= data.settings.goal; })[0];
    if (done) openParty(done);
    list.forEach(function (c) {
      var card = el('div', 'card');
      card.appendChild(el('div', 'name', c.nick ? c.nick + ' 님' : '단골 손님'));
      card.appendChild(el('div', 'muted', '스탬프 ' + c.stamps + ' / ' + data.settings.goal + '개'));
      card.appendChild(boardOf(c));
      if (c.stamps >= data.settings.goal) {
        card.appendChild(el('div', 'reward-box', '🎁 다 모았어요! 사장님께 "' + data.settings.reward + '"을(를) 말씀하세요.'));
      } else {
        card.appendChild(el('div', 'msg', (data.settings.goal - c.stamps) + '개만 더 모으면 "' + data.settings.reward + '"!'));
      }
      if (c.rewards) card.appendChild(el('div', 'muted', '지금까지 받은 선물: ' + c.rewards + '번'));
      box.appendChild(card);
    });
  };

  // 축하 화면
  function openParty(c) {
    var p = $('party');
    var old = p.querySelectorAll('.confetti');
    for (var k = 0; k < old.length; k++) old[k].remove();
    var emojis = ['🎉', '✨', '🌸', '⭐', '🎊', '💖'];
    var colors = ['#ff8fb1', '#ffb27a', '#ffe066', '#7fd8be', '#8ec5ff', '#c9a7ff'];
    for (var i = 0; i < 110; i++) {
      var s;
      if (i % 3 === 0) {
        s = el('span', 'confetti', emojis[i % emojis.length]);
        s.style.fontSize = (18 + Math.random() * 18) + 'px';
      } else {
        s = el('span', 'confetti paper');
        s.style.background = colors[i % colors.length];
        s.style.width = (6 + Math.random() * 8) + 'px';
        s.style.height = (10 + Math.random() * 10) + 'px';
      }
      s.style.left = (Math.random() * 100) + '%';
      s.style.animationDuration = (2.5 + Math.random() * 3) + 's';
      s.style.animationDelay = (-Math.random() * 5) + 's';
      p.appendChild(s);
    }
    $('partyText').innerHTML = '';
    $('partyText').appendChild(document.createTextNode('스탬프 ' + data.settings.goal + '개를 모두 모았어요! 정말 멋진 단골 손님이세요 💖'));
    $('partyText').appendChild(document.createElement('br'));
    $('partyText').appendChild(document.createTextNode('"' + data.settings.reward + '"을(를) 받아 가세요 🎁'));
    p.classList.remove('hidden');
  }
  $('closeParty').onclick = function () { $('party').classList.add('hidden'); };

  // ---------- 잠금 ----------
  function showLock() {
    if (unlocked) { showMain(); return; }
    $('lockCard').classList.remove('hidden');
    $('ownerMain').classList.add('hidden');
    $('pinInput').value = ''; $('pinMsg').textContent = '';
    if (!data.settings.pin) {
      $('lockTitle').textContent = '비밀번호 만들기';
      $('lockWarn').textContent = '처음이시네요! 숫자 4자리 비밀번호를 정해 주세요. 이 비밀번호는 손님이 실수로 만지는 것을 막아 줄 뿐, 아주 강한 잠금은 아니에요. 생일이나 전화번호 같은 중요한 숫자는 쓰지 마세요.';
      $('pinOk').textContent = '비밀번호 정하기';
    } else {
      $('lockTitle').textContent = '사장님 비밀번호';
      $('lockWarn').textContent = '사장님만 들어갈 수 있어요.';
      $('pinOk').textContent = '들어가기';
    }
  }
  $('pinInput').oninput = function () { onlyDigits(this); };
  $('pinOk').onclick = function () {
    var v = $('pinInput').value;
    if (!/^\d{4}$/.test(v)) { $('pinMsg').textContent = '숫자 4개를 넣어 주세요.'; return; }
    if (!data.settings.pin) { data.settings.pin = v; save(); unlocked = true; showMain(); return; }
    if (v === data.settings.pin) { unlocked = true; showMain(); }
    else { $('pinMsg').textContent = '비밀번호가 달라요. 다시 해 주세요.'; $('pinInput').value = ''; }
  };
  $('lockBtn').onclick = function () {
    unlocked = false; currentId = null; showTab(false);
  };

  // ---------- 사장님 메인 ----------
  function showMain() {
    $('lockCard').classList.add('hidden');
    $('ownerMain').classList.remove('hidden');
    $('setGoal').value = data.settings.goal;
    $('setReward').value = data.settings.reward;
    renderAll();
    checkBackup();
  }
  function renderAll() { renderCustomer(); renderList(); }

  $('ownerInput').oninput = function () { onlyDigits(this); };
  $('ownerFind').onclick = function () {
    var v = $('ownerInput').value, pick = $('ownerPick');
    pick.textContent = ''; currentId = null; renderCustomer();
    if (!/^\d{4}$/.test(v)) { $('ownerMsg').textContent = '숫자 4개를 넣어 주세요.'; return; }
    var list = byLast4(v);
    if (list.length === 1) { currentId = list[0].id; $('ownerMsg').textContent = ''; renderCustomer(); return; }
    $('ownerMsg').textContent = list.length ? '같은 번호의 손님이 있어요. 골라 주세요.' : '새 손님이에요. 별명을 적고 등록해 주세요. (안 적어도 돼요)';
    list.forEach(function (c) {
      var it = el('div', 'item pick', label(c) + ' · ★' + c.stamps);
      it.onclick = function () { currentId = c.id; pick.textContent = ''; $('ownerMsg').textContent = ''; renderCustomer(); };
      pick.appendChild(it);
    });
    var nick = el('input'); nick.placeholder = '별명 (예: 민지)'; nick.maxLength = 10;
    var add = el('button', 'btn soft', list.length ? '+ 다른 손님으로 새로 등록' : '+ 새 손님 등록');
    add.onclick = function () {
      var c = { id: newId(), last4: v, nick: nick.value.trim().slice(0, 10), stamps: 0, rewards: 0 };
      data.customers.push(c); save();
      currentId = c.id; pick.textContent = ''; $('ownerMsg').textContent = '등록했어요!';
      renderAll();
    };
    pick.appendChild(nick); pick.appendChild(add);
  };

  function renderCustomer() {
    var box = $('ownerCustomer'); box.textContent = '';
    var c = currentId && byId(currentId);
    if (!c) return;
    var card = el('div', 'card');
    card.appendChild(el('div', 'name', label(c)));
    card.appendChild(el('div', 'muted', '스탬프 ' + c.stamps + ' / ' + data.settings.goal + '개 · 받은 선물 ' + c.rewards + '번'));
    card.appendChild(boardOf(c));
    var full = c.stamps >= data.settings.goal;
    if (full) card.appendChild(el('div', 'reward-box', '🎁 보상: ' + data.settings.reward));

    var stampBtn = el('button', 'btn', '⭐ 스탬프 찍기');
    stampBtn.disabled = full;
    stampBtn.onclick = function () { c.stamps++; save(); renderAll(); };
    card.appendChild(stampBtn);

    if (full) {
      var rb = el('button', 'btn', '🎁 보상 드렸어요 (스탬프 0개로)');
      rb.onclick = function () { c.stamps = 0; c.rewards++; save(); renderAll(); };
      card.appendChild(rb);
    }
    var row = el('div', 'row');
    var undo = el('button', 'btn soft', '↩ 하나 취소');
    undo.disabled = c.stamps === 0;
    undo.onclick = function () { if (c.stamps > 0) { c.stamps--; save(); renderAll(); } };
    var del = el('button', 'btn soft', '🗑 손님 지우기');
    del.onclick = function () {
      if (confirm(label(c) + ' 손님을 지울까요? 되돌릴 수 없어요.')) {
        data.customers = data.customers.filter(function (x) { return x.id !== c.id; });
        save(); currentId = null; renderAll();
      }
    };
    row.appendChild(undo); row.appendChild(del);
    card.appendChild(row);
    box.appendChild(card);
  }

  function renderList() {
    var box = $('listBox'); box.textContent = '';
    $('countText').textContent = '(' + data.customers.length + '명)';
    if (!data.customers.length) { box.appendChild(el('div', 'muted', '아직 등록된 손님이 없어요.')); return; }
    data.customers.slice().sort(function (a, b) { return b.stamps - a.stamps; }).forEach(function (c) {
      var it = el('div', 'item pick', label(c) + ' · ★' + c.stamps + '/' + data.settings.goal);
      it.onclick = function () { currentId = c.id; renderCustomer(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
      box.appendChild(it);
    });
  }

  // ---------- 설정 ----------
  $('saveSet').onclick = function () {
    var g = parseInt($('setGoal').value, 10), r = $('setReward').value.trim();
    if (!(g >= 2 && g <= 30)) { $('setMsg').textContent = '개수는 2에서 30 사이로 해 주세요.'; return; }
    if (!r) { $('setMsg').textContent = '보상 이름을 적어 주세요.'; return; }
    data.settings.goal = g; data.settings.reward = r.slice(0, 20);
    data.customers.forEach(function (c) { if (c.stamps > g) c.stamps = g; });
    save(); $('setMsg').textContent = '저장했어요!'; renderAll();
  };

  // ---------- 백업 ----------
  $('exportBtn').onclick = function () {
    data = load();
    var copy = JSON.parse(JSON.stringify(data));
    copy.settings.pin = ''; // 비밀번호는 백업 파일에 넣지 않아요
    var blob = new Blob([JSON.stringify(copy, null, 1)], { type: 'application/json' });
    var a = document.createElement('a');
    var d = new Date();
    a.href = URL.createObjectURL(blob);
    a.download = '스탬프백업_' + d.getFullYear() + (d.getMonth() + 1) + d.getDate() + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    try { localStorage.setItem(BK_KEY, String(Date.now())); } catch (e) {}
    checkBackup();
    $('backupMsg').textContent = '백업 파일을 저장했어요.';
  };
  $('importBtn').onclick = function () { $('importFile').click(); };
  $('importFile').onchange = function () {
    var f = this.files[0]; if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var d = clean(JSON.parse(rd.result));
        if (!d) throw 0;
        if (!confirm('지금 있는 자료가 백업 자료로 바뀌어요. 계속할까요?')) return;
        if (!d.settings.pin) d.settings.pin = data.settings.pin;
        data = d; save(); currentId = null;
        $('backupMsg').textContent = '불러왔어요!';
        $('setGoal').value = data.settings.goal; $('setReward').value = data.settings.reward;
        renderAll();
      } catch (e) { $('backupMsg').textContent = '올바른 백업 파일이 아니에요.'; }
    };
    rd.readAsText(f);
    this.value = '';
  };
})();
</script>
</body>
</html>
